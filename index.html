<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Finder</title>
    <Link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1> Pokemon finder </h1>
    
    <form id="search-form" class="search" autocomplete="on">
        <label class="sr-only" for="pokemon-input"> Pokemon Name </label>
        <input id="pokemon-input" type="text" placeholder="Try ditto, pikachu, charmander" />

        <button type="submit" id="search-button"> Search the Pokedex </button>
    </form>

<p id="message" role="status"></p>

<div id="result" hidden>
    <h2 id="pokemon-name"></h2>
    <img id="pokemon-image" alt="" width="180">
    <p>Type: <span id="pokemon-type"></span></p>
    <p> Height: <span id="pokemon-height"></span></p>
    <p> Weight: <span id= "pokemon-weight"></span></p>
</div>




<footer> Data From <a href="https://pokeapi.co/" target="_blank"> PokeAPI </a></footer>


<script src="script.js"> </script>
</body>
</html>
